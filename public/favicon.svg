<!-- The header mark (src/assets/mark.svg), painted rather than masked.
     .app-mark fills that silhouette from the theme's ink token, but a favicon
     sits on the browser's tab bar rather than on our canvas, so it carries its
     own ink and flips with the browser's colour scheme. Full strength, not the
     header's 28-35% ramp: at 16px a muted mark reads as a smudge. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18">
  <style>
    path { fill: #18181b }
    @media (prefers-color-scheme: dark) { path { fill: #ffffff } }
  </style>
