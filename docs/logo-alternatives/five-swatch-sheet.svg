<text x="410" y="289" font-size="19" fill="#73766D">Distinct parts. A coherent whole.</text>
<text x="410" y="330" font-size="15" fill="#73766D">Five equal swatches form an open C.</text>
<text x="410" y="354" font-size="15" fill="#73766D">Separation is the idea, and the construction.</text>
