 <text x="824" y="148" font-size="12" fill="#73786F" letter-spacing="1.5">04 / PAIRWISE</text>
 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 36" x="866" y="190" width="220" height="190"><defs><mask id="pair10" maskUnits="userSpaceOnUse" x="0" y="0" width="44" height="36"><rect width="44" height="36" fill="white"/><g fill="black" stroke="black" stroke-width="2"><path d="M19 9H30C37.18 9 43 14.82 43 22S37.18 35 30 35H19V29H30A7 7 0 0 0 30 15H19Z"/></g></mask></defs><g fill="#6A58A8" mask="url(#pair10)"><path d="M25 1H14C6.82 1 1 6.82 1 14S6.82 27 14 27H25V21H14A7 7 0 0 1 14 7H25Z"/></g><g fill="#D6583D"><path d="M19 9H30C37.18 9 43 14.82 43 22S37.18 35 30 35H19V29H30A7 7 0 0 0 30 15H19Z"/></g></svg>
 <text x="824" y="436" font-size="28" letter-spacing="-1">Pairwise</text>
 <text x="824" y="469" font-size="14" fill="#646960">Two Cs, designed in relation to each other.</text>
 <text x="824" y="503" font-size="12" fill="#646960">Opposing Cs form a compact, interlocking monogram.</text>
 <text x="824" y="523" font-size="12" fill="#646960">A nod to the app’s pairwise color comparisons.</text>
 <path d="M824 550H1128" stroke="#E0E1D8"/>
