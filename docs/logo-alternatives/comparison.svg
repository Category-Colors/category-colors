 <text x="72" y="436" font-size="28" letter-spacing="-1">Swatchbook</text>
 <text x="72" y="469" font-size="14" fill="#646960">A familiar tool, reduced to a symbol.</text>
 <text x="72" y="503" font-size="12" fill="#646960">Three hinged cards make the palette tangible.</text>
 <text x="72" y="523" font-size="12" fill="#646960">A small pivot gives the mark a memorable detail.</text>
 <path d="M72 550H376" stroke="#E0E1D8"/>
