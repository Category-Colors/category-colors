 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" x="490" y="190" width="220" height="190"><circle cx="8" cy="8" r="7" fill="#D9563B"/><rect x="19" y="2" width="12" height="12" fill="#D69C27"/><path d="M0 31L8 17L16 31Z" fill="#4777B8"/><path d="M18 18H32V32A14 14 0 0 1 18 18Z" fill="#318A79"/></svg>
 <text x="448" y="436" font-size="28" letter-spacing="-1">Categories</text>
 <text x="448" y="469" font-size="14" fill="#646960">Difference you can see without color.</text>
 <text x="448" y="503" font-size="12" fill="#646960">Circle, square, triangle, and quarter-circle.</text>
 <text x="448" y="523" font-size="12" fill="#646960">Each category has its own unmistakable shape.</text>
 <path d="M448 550H752" stroke="#E0E1D8"/>
