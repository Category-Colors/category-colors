<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <!-- viewport-fit=cover so the floating toolbar can sit above the home
         indicator rather than beside it; index.css pads by the safe area. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Category Colors</title>
    <meta name="description" content="A browser-based optimizer for categorical color palettes." />

    <!-- The card art is the About splash, minus its credits, rendered to a
         fixed 1200×630 plate — see scripts/og-card.html. Absolute URLs because
         crawlers resolve these against nothing. -->
    <link rel="canonical" href="https://categorycolors.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Category Colors" />
    <meta property="og:url" content="https://categorycolors.com/" />
    <meta property="og:title" content="Category Colors" />
    <meta property="og:description" content="A browser-based optimizer for categorical color palettes." />
    <meta property="og:image" content="https://categorycolors.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Concentric rings of orange, pink, cyan and yellow over a violet field, beside an orange panel reading Category colors." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
